name: Vercel Preview Verify

on:
  deployment_status:

concurrency:
  group: vercel-preview-${{ github.event.deployment_status.deployment.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-preview:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '' && contains(github.event.deployment_status.environment_url, 'vercel.app')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install visual diff dependencies
        run: python3 -m pip install --user Pillow

      - name: Wait for preview healthcheck
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          for attempt in $(seq 1 40); do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' "${PREVIEW_URL%/}/manifest.webmanifest" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Preview did not become ready at ${PREVIEW_URL}" >&2
          exit 1

      - name: Run preview verification
        env:
          BASELINE_DIR: tests/baselines/live
          CI: "true"
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: pnpm test:preview

      - name: Upload preview QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  course-dates-clock:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '' && contains(github.event.deployment_status.environment_url, 'vercel.app')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nov20-la
            tz: America/Los_Angeles
            fake_now: "2026-11-20T12:00:00-08:00"
          - name: nov20-utc
            tz: UTC
            fake_now: "2026-11-20T12:00:00Z"
          - name: dec20-la
            tz: America/Los_Angeles
            fake_now: "2026-12-20T12:00:00-08:00"
          - name: dec20-utc
            tz: UTC
            fake_now: "2026-12-20T12:00:00Z"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Course-dates contract under ${{ matrix.name }}
        env:
          CI: "true"
          COURSE_DATES_FAKE_NOW: ${{ matrix.fake_now }}
          PLAYWRIGHT_NO_WEBSERVER: "1"
          TZ: ${{ matrix.tz }}
        run: pnpm test:course-dates-contract
