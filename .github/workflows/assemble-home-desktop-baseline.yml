name: Assemble home desktop baseline

on:
  push:
    branches:
      - cursor/home-desktop-baseline-da0e

permissions:
  contents: write

concurrency:
  group: assemble-home-desktop-baseline
  cancel-in-progress: true

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, 'Refresh home-desktop visual baseline') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify PNG
        run: |
          set -euo pipefail
          URL='https://tmpfiles.org/dl/1788204423.fd1e0add354eb4e7/wQwAsBu2bt5G/home-desktop.png'
          curl -fsSL -A 'Mozilla/5.0' -o tests/baselines/live/visual/home-desktop.png "$URL"
          python3 <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('tests/baselines/live/visual/home-desktop.png')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = 'b87bf326dc64a62603df7e697247c3d02cf8a7ff35e3611bcc8b6bc9e61ca722'
          if digest != expected:
              raise SystemExit(f'png sha256 mismatch: {digest} size={path.stat().st_size}')
          print(f'wrote {path} ({path.stat().st_size} bytes)')
          PY

      - name: Commit assembled baseline
        run: |
          git config user.name "enzo"
          git config user.email "enzo@design-prism.com"
          git add tests/baselines/live/visual/home-desktop.png
          git status
          git commit -m "Refresh home-desktop visual baseline after September 12 DA filled."
          git push
