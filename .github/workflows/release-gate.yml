name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify student enrollment locks on real Postgres
        env:
          STUDENT_LOCK_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rda_locks
        run: |
          set -euo pipefail
          docker run -d --name rda-locks-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rda_locks \
            -p 5432:5432 \
            postgres:17
          trap 'docker rm -f rda-locks-pg' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec rda-locks-pg pg_isready -h 127.0.0.1 -U postgres -d rda_locks; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          pnpm test:student-enrollment-locks

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Install visual diff dependencies
        run: python3 -m pip install --user Pillow

      - name: Verify isolated OpenAI measurement
        env:
          CI: "true"
          DATABASE_URL: ""
          RDA_SYNC_SECRET: ""
          CRON_SECRET: ""
        run: pnpm test:openai

      - name: Verify optional secondary Meta Pixel
        env:
          CI: "true"
          DATABASE_URL: ""
          RDA_SYNC_SECRET: ""
          CRON_SECRET: ""
          NEXT_PUBLIC_META_SECONDARY_PIXEL_ID: "999888777666555"
        run: pnpm test:meta-secondary

      - name: Run frozen-clone release gate
        env:
          BASELINE_DIR: tests/baselines/live
          CI: "true"
          LOCAL_ORIGIN: http://127.0.0.1:3100
        run: pnpm test:release

      - name: Verify attribution database integrity
        run: pnpm test:attribution-db

      - name: Verify isolated student enrollment and pilot fixtures
        run: pnpm test:student-enrollment

      - name: Verify paid-media measurement
        env:
          CI: "true"
          DATABASE_URL: ""
          RDA_SYNC_SECRET: ""
          CRON_SECRET: ""
          PLAYWRIGHT_SERVER_MODE: prod
          LOCAL_ORIGIN: http://127.0.0.1:3110
        run: pnpm test:attribution

      - name: Verify academy policies and private tools
        env:
          CI: "true"
          DATABASE_URL: ""
          PLAYWRIGHT_SERVER_MODE: prod
          LOCAL_ORIGIN: http://127.0.0.1:3111
        run: pnpm test:academy

      - name: Verify seasonal decoration layer
        env:
          CI: "true"
          DATABASE_URL: ""
          PLAYWRIGHT_SERVER_MODE: prod
          LOCAL_ORIGIN: http://127.0.0.1:3112
        run: pnpm test:seasonal

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  student-enrollment-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rda_locks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rda_locks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify student enrollment locks on real Postgres
        env:
          STUDENT_LOCK_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rda_locks
        run: pnpm test:student-enrollment-locks
