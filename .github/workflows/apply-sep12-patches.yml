name: apply-sep12-patches

on:
  push:
    branches:
      - cursor/mark-sep12-da-full-da0e
    paths:
      - ".github/workflows/apply-sep12-patches.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cursor/mark-sep12-da-full-da0e
          fetch-depth: 0

      - name: Restore files from main, patch copy, and push
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            lib/site-data.ts \
            tests/smoke.spec.ts \
            tests/interaction-flow.spec.ts \
            tests/baselines/live/content
          python3 scripts/apply-sep12-full-copy.py
          git config user.email "enzo@design-prism.com"
          git config user.name "enzo"
          git add lib/site-data.ts tests/smoke.spec.ts tests/interaction-flow.spec.ts tests/baselines/live/content
          git rm -f .github/workflows/apply-sep12-patches.yml scripts/apply-sep12-full-copy.py
          git commit -m "Mark September 12 Saturday Academy Dental Assisting class full."
          git push origin HEAD:cursor/mark-sep12-da-full-da0e
